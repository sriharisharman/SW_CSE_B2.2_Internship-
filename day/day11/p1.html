<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Working with ttributes: JS</title>
</head>
<body>
     <img src="..\Images\dog_image.jpg" alt="">
      <!-- getAttributes & setAttributes -->
       <script>
        const img = document.querySelector("img")
        // Read attribute
        const src =img.getAttribute("src");

        // set attribute
        img.setAttribute("alt","Image of an animal");
        img.setAttribute("src", "../Images/lion.jpg")

        // removeAttrinute and hasAttribute
        const input = document.querySelector("input");
        console.log(input.hasAttribute("disabled"));
        input.removeAttribute("disabled");

       </script>
</body>
</html>
