<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>div and span tag</title>
    <style>
        .card{
            background-color:rgb(238, 125, 39);
        }
        .highlight{
            background-color: rgb(221, 245, 11);
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Product card</h2>
        <p>This product is the best and th another best part is its <span class="highlight">on sale</span></p>
    </div>
    
</body>
</html>
