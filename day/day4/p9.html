<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors | Class Selector</title>
    <style>
        .Style1{
            font-size: 22px;
            color: blue;
            background-color: orangered;
        }
        .Style2{
            font-size: 24px;
            font-weight: bold;
        }
        .Style3{
            background-color: green;
            font-weight: 800;
            font-size: x-large;
            font-variant: small-caps;
        }
    </style>
</head>
<body>
    <h1 class="Style1">Class Selector</h1>
    <h1 class="Style2">Heading tag itslef, but a different style</h1>
    <p>This is a a new paragraph that I have created </p>
    <p class="Style3">This is a second paragraph </p>
</body>
</html>
