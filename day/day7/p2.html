<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transfrom</title>
    <style>
        .box1{
            transform: translatex(50px) scale(1.005);
            background-color: bisque;
            border: 3px solid black;
        }
        .box2{
            transform: translatey(20px) scale(1.005);
            background-color: cadetblue;
            border: 3px solid black;
        }
        .box3{
            transform: translate(100px, 60px) rotate(180deg);
            
            background-color: cornsilk;
            border: 3px solid black;
        }
    </style>
</head>
<body>
    <p>CSS Transfrom: Property to visually move, rotate, enlarge, shrink. It can do it in 2d or 3d </p>
    <!-- Syntax -->
    transfrom: transform-function(value)
    <div class="box1">
        <p>Hello, We are learning CSS Transfrom </p>
    </div>
    <div class="box2">
        <p>Hello, We are learning CSS Transfrom </p>
    </div>
    <div class="box3">
        <p>Hello, We are learning CSS Transfrom </p>
    </div>

</body>
</html>
