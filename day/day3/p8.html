<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Tag</title>
</head>
<body>
    <p>Video Tag example</p>
    <video src="../videos\sample_video.mp4" controls type="video/mp4"></video>
    <!-- Width and height  -->
    <video src="../videos\sample_video.mp4" controls type="video/mp4" width="600" height="600"></video>
    <!-- Autoplay -->
    <video src="../videos\sample_video.mp4" controls type="video/mp4" autoplay></video>
    <!-- Loop -->
    <video src="../videos\sample_video.mp4" controls loop autoplay muted width="640" height="360"></video>
    <!-- Poster -->
    <video src="./videos\sample_video.mp4" controls type="video/mp4" poster="../Images\dog_image.jpg"></video>

</body>
</html>
